name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      LANTERN_MODE: memory
      BEDROCK_ENABLED: "false"
      NOTIFY_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          if [ -f dashboard/package.json ]; then (cd dashboard && npm install --no-audit --no-fund); fi
      - name: Check
        run: python scripts/tasks.py check
