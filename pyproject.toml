[project]
name = "lantern"
version = "0.1.0"
description = "Lantern: supply planning that keeps working when the data goes dark (SparthHill Hack 2026)"
requires-python = ">=3.10"   # team standard is 3.12
dependencies = [
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "python-dotenv>=1.0",
  "boto3>=1.34",
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "xgboost>=2.0",
  "fastapi>=0.110",
  "mangum>=0.17",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4", "moto>=5", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lantern_core*", "api*", "simulator*", "ingest*", "baselines*", "eval*",
           "engine*", "models*", "gate*", "explain*", "alerts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "UP007", "B008"]
